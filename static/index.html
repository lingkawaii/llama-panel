<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llama.cpp 控制面板</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --border: #30363d;
    --fg: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --ok: #3fb950; --warn: #d29922; --err: #f85149;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.5 system-ui, "Segoe UI", sans-serif; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 8px 0 16px; }
  h2 { font-size: 14px; color: var(--muted); margin: 0 0 8px; text-transform: uppercase; letter-spacing: .05em; }
  .grid { display: grid; gap: 12px; }
  .cards { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .card .label { color: var(--muted); font-size: 12px; }
  .card .value { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 4px; }
  .card .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--err); display: inline-block; }
  .dot.on { background: var(--ok); }
  button { background: var(--card); color: var(--fg); border: 1px solid var(--border);
           border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 13px; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.danger:hover { border-color: var(--err); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border);
          font-variant-numeric: tabular-nums; }
  th { color: var(--muted); font-weight: 500; }
  code { background: #21262d; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  #logs { background: #010409; border: 1px solid var(--border); border-radius: 8px;
          padding: 10px; font: 12px/1.6 ui-monospace, Consolas, monospace;
          height: 240px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; }
  .tag.busy { background: rgba(63,185,80,.15); color: var(--ok); }
  .tag.idle { background: rgba(139,148,158,.15); color: var(--muted); }
  section { margin-bottom: 20px; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>
    <span class="dot" id="dot"></span>
    llama.cpp 控制面板
    <span class="muted" id="server-url"></span>
  </h1>

  <section>
    <h2>服务</h2>
    <div class="card">
      <div class="row">
        <span class="dot" id="proc-dot"></span>
        <span id="proc-state" class="muted">…</span>
        <span style="flex:1"></span>
        <button id="btn-start">启动</button>
        <button id="btn-stop" class="danger">停止</button>
      </div>
      <div class="sub" id="proc-cmd"></div>
    </div>
  </section>

  <section>
    <h2>模型</h2>
    <div class="card" id="model-card"><span class="muted">加载中…</span></div>
  </section>

  <section>
    <h2>指标</h2>
    <div class="grid cards" id="metric-cards"></div>
    <div class="card" style="margin-top:12px">
      <table id="metric-table">
        <thead><tr><th>指标</th><th>值</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section>
    <h2>槽位</h2>
    <div class="card">
      <table id="slot-table">
        <thead>
          <tr><th>ID</th><th>状态</th><th>上下文</th><th>提示词 tokens</th><th>生成 tokens</th><th>提示词速度</th><th>生成速度</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section>
    <h2>日志</h2>
    <div id="logs"></div>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
let lastProc = null; // 最近一次状态里的进程信息（供日志区提示用）

// 按基础名查找指标（兼容带标签的变体）
function metricValue(metrics, name) {
  if (!metrics) return null;
  if (name in metrics) return metrics[name];
  for (const k of Object.keys(metrics)) {
    if (k.startsWith(name + "{")) return metrics[k];
  }
  return null;
}

function fmt(v, unit = "") {
  if (v === null || v === undefined) return "—";
  if (typeof v === "number") {
    const n = Math.abs(v) >= 1000 ? v.toLocaleString(undefined, {maximumFractionDigits: 0})
              : Number.isInteger(v) ? v.toLocaleString()
              : v.toFixed(2);
    return n + unit;
  }
  return String(v);
}

function fmtUptime(s) {
  if (s === null || s === undefined) return "—";
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h}h ${m}m` : m ? `${m}m ${Math.floor(s % 60)}s` : `${Math.floor(s)}s`;
}

function modelId(models) {
  const d = models?.data;
  return Array.isArray(d) && d.length ? d[0].id : null;
}

function renderStatus(data) {
  const s = data.server, p = s.process;
  lastProc = p;
  $("dot").className = "dot" + (s.health ? " on" : "");
  $("proc-dot").className = "dot" + (p.running ? " on" : "");
  $("server-url").textContent = s.base_url;
  $("proc-state").textContent = p.running
    ? (p.external
        ? `运行中（外部）· PID ${p.pid}`
        : `运行中 · PID ${p.pid} · ${fmtUptime(p.uptime)}`)
    : "未运行";
  $("proc-cmd").textContent = p.external ? "（外部启动，非面板拉起）" : p.command.join(" ");
  $("btn-start").disabled = p.running;
  $("btn-stop").disabled = !p.running;

  // 模型
  const mid = modelId(s.models);
  const meta = s.models?.data?.[0]?.meta || {};
  $("model-card").innerHTML = mid
    ? `<div class="label">模型</div><div class="value" style="font-size:16px">${mid}</div>
       <div class="sub">n_ctx ${fmt(meta.n_ctx)} · 架构 ${meta.architecture || "?"}</div>`
    : `<span class="muted">无模型信息（服务未启动或未加载模型）</span>`;

  // 指标卡
  const m = data.metrics;
  const cards = [
    ["生成速度", m ? metricValue(m, "llamacpp:predicted_tokens_seconds") : null, "tok/s"],
    ["提示词速度", m ? metricValue(m, "llamacpp:prompt_tokens_seconds") : null, "tok/s"],
    ["处理中请求", m ? metricValue(m, "llamacpp:requests_processing") : null, ""],
    ["排队请求", m ? metricValue(m, "llamacpp:requests_deferred") : null, ""],
    ["上下文高水位", m ? metricValue(m, "llamacpp:n_tokens_max") : null, "tok"],
    ["提示词 tokens 累计", m ? metricValue(m, "llamacpp:prompt_tokens_total") : null, ""],
    ["生成 tokens 累计", m ? metricValue(m, "llamacpp:tokens_predicted_total") : null, ""],
    ["spec 接受率", specAccept(m), "%"],
  ];
  $("metric-cards").innerHTML = cards.map(([label, v, u]) =>
    `<div class="card"><div class="label">${label}</div>
     <div class="value">${fmt(v, u)}</div></div>`).join("");

  // 全量指标表
  const rows = m ? Object.entries(m).map(([k, v]) =>
    `<tr><td><code>${k}</code></td><td>${fmt(v)}</td></tr>`).join("")
    : `<tr><td colspan="2" class="muted">无指标（服务端需加 --metrics 启动）</td></tr>`;
  $("metric-table").querySelector("tbody").innerHTML = rows;

  // 槽位
  const slots = data.slots || [];
  $("slot-table").querySelector("tbody").innerHTML = slots.length
    ? slots.map(slotRows).join("")
    : `<tr><td colspan="7" class="muted">无槽位</td></tr>`;
}

function slotRows(s) {
  const sp = s.speed || {};
  const busy = s.is_processing;
  return `<tr>
    <td>${s.id ?? "?"}</td>
    <td><span class="tag ${busy ? "busy" : "idle"}">${busy ? "处理中" : "空闲"}</span></td>
    <td>${fmt(s.n_ctx)}</td>
    <td>${fmt(s.n_prompt_tokens ?? sp.prompt_n)}</td>
    <td>${fmt(s.n_decoded ?? sp.decoded_n)}</td>
    <td>${fmt(sp.prompt_n_per_second, " tok/s")}</td>
    <td>${fmt(sp.decoded_n_per_second, " tok/s")}</td>
  </tr>`;
}

function specAccept(m) {
  if (!m) return null;
  const acc = metricValue(m, "llamacpp:spec_decode_num_accepted_tokens_total");
  const draft = metricValue(m, "llamacpp:spec_decode_num_draft_tokens_total");
  if (acc === null || draft === null || draft === 0) return null;
  return acc / draft * 100;
}

async function fetchStatus() {
  try {
    const r = await fetch("/api/status");
    renderStatus(await r.json());
  } catch (e) {
    $("dot").className = "dot";
    $("proc-state").textContent = "面板连接失败";
  }
}

async function fetchLogs() {
  try {
    const r = await fetch("/api/logs?n=200");
    const data = await r.json();
    const box = $("logs");
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 20;
    box.textContent = data.lines.join("\n") || (
      lastProc && lastProc.running && lastProc.external
        ? "无日志：服务为外部启动。将 --log 指向其日志文件，或用面板「启动」接管。"
        : "无日志"
    );
    if (atBottom) box.scrollTop = box.scrollHeight;
  } catch {}
}

$("btn-start").onclick = async () => {
  const r = await fetch("/api/server/start", {method: "POST"});
  const d = await r.json();
  if (!d.ok) alert(d.error);
  fetchStatus();
};
$("btn-stop").onclick = async () => {
  await fetch("/api/server/stop", {method: "POST"});
  fetchStatus();
};

fetchStatus();
fetchLogs();
setInterval(fetchStatus, 2000);
setInterval(fetchLogs, 5000);
</script>
</body>
</html>
