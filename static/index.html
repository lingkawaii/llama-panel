<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llama.cpp 控制面板</title>
<style>
  :root {
    --bg: #090b10;
    --card: rgba(18, 22, 31, 0.82);
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.14);
    --fg: #e8ecf3; --muted: #8b93a7;
    --accent: #5b8cff; --accent-soft: rgba(91, 140, 255, 0.16);
    --ok: #34d399; --warn: #f5b942; --err: #f75c5c;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body { margin: 0; color: var(--fg);
         font: 14px/1.55 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
         background:
           radial-gradient(900px 480px at 18% -12%, rgba(99, 102, 241, 0.14), transparent 60%),
           radial-gradient(760px 420px at 82% -10%, rgba(34, 211, 238, 0.10), transparent 60%),
           var(--bg);
         background-attachment: fixed; min-height: 100vh; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 8px 0 16px; font-weight: 600; }
  h2 { font-size: 12px; color: var(--muted); margin: 0 0 8px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
  .grid { display: grid; gap: 12px; }
  .metrics-grid { display: grid; gap: 12px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  @media (max-width: 768px) {
    .metrics-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  .card {
    background: var(--card);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 6px 18px rgba(0, 0, 0, 0.28);
    transition: border-color .18s ease, background .18s ease, box-shadow .18s ease;
  }
  .card:hover {
    border-color: var(--border-strong);
    background: rgba(22, 27, 38, 0.85);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 10px 26px rgba(0, 0, 0, 0.34);
  }
  .card .label { color: var(--muted); font-size: 12px; }
  .card .value { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 4px; }
  .card .value .unit { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 6px; }
  .card .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .actions { display: flex; gap: 8px; flex-shrink: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--err); display: inline-block; flex-shrink: 0; }
  .dot.on { background: var(--ok); animation: dot-breathe 2.2s ease-in-out infinite; }
  @keyframes dot-breathe {
    0%, 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.45); }
    50% { box-shadow: 0 0 0 6px rgba(52, 211, 153, 0); }
  }
  button {
    background: rgba(255, 255, 255, 0.04); color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 14px; cursor: pointer; font-size: 13px;
    transition: background .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  button:hover { background: rgba(255, 255, 255, 0.08); border-color: var(--border-strong); }
  button:disabled { opacity: .45; cursor: default; }
  button:disabled:hover { background: rgba(255, 255, 255, 0.04); border-color: var(--border); }
  button.btn-primary, #btn-start, #btn-apply-sleep-idle, #confirm-ok, .mm-load {
    background: var(--accent-soft); border-color: rgba(91, 140, 255, 0.45); color: #c7d7ff;
  }
  button.btn-primary:hover, #btn-start:hover, #btn-apply-sleep-idle:hover,
  #confirm-ok:hover, .mm-load:hover {
    background: rgba(91, 140, 255, 0.26); border-color: rgba(91, 140, 255, 0.7);
    box-shadow: 0 0 0 3px rgba(91, 140, 255, 0.12);
  }
  button.danger { color: #f3b8b8; }
  button.danger:hover {
    border-color: rgba(247, 92, 92, 0.65); background: rgba(247, 92, 92, 0.12);
    box-shadow: 0 0 0 3px rgba(247, 92, 92, 0.1);
  }
  .power-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .power-info { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .power-icon {
    width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    background: rgba(91, 140, 255, 0.14); border: 1px solid rgba(91, 140, 255, 0.3);
  }
  .power-icon svg { width: 16px; height: 16px; }
  .power-title { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .power-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .seg {
    display: inline-flex; gap: 4px; padding: 4px; flex-shrink: 0;
    background: rgba(0, 0, 0, 0.35); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.45);
  }
  .power-btn {
    border: 1px solid transparent; background: transparent; border-radius: 9px;
    padding: 5px 14px; color: var(--muted);
  }
  .power-btn:hover { background: rgba(255, 255, 255, 0.06); color: var(--fg); }
  .power-btn.active {
    background: linear-gradient(135deg, rgba(91, 140, 255, 0.5), rgba(91, 140, 255, 0.18));
    border-color: rgba(91, 140, 255, 0.65); color: #dbe6ff;
    box-shadow: 0 0 10px rgba(91, 140, 255, 0.35), inset 0 0 0 1px rgba(91, 140, 255, 0.25);
  }
  .gpu-cap-btn {
    border: 1px solid transparent; background: transparent; border-radius: 9px;
    padding: 5px 12px; color: var(--muted); font-size: 12px; white-space: nowrap;
  }
  .gpu-cap-btn:hover { background: rgba(255, 255, 255, 0.06); color: var(--fg); }
  .gpu-cap-btn.active {
    background: linear-gradient(135deg, rgba(91, 140, 255, 0.5), rgba(91, 140, 255, 0.18));
    border-color: rgba(91, 140, 255, 0.65); color: #dbe6ff;
    box-shadow: 0 0 10px rgba(91, 140, 255, 0.35), inset 0 0 0 1px rgba(91, 140, 255, 0.25);
  }
  .gpu-cap-err { color: var(--err); font-size: 12px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.06);
          font-variant-numeric: tabular-nums; }
  th { color: var(--muted); font-weight: 500; }
  code { background: rgba(255, 255, 255, 0.07); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  #logs {
    background: rgba(2, 4, 8, 0.75); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px; font: 12px/1.6 ui-monospace, Consolas, monospace;
    height: 240px; overflow-y: auto; white-space: pre-wrap; word-break: break-all;
  }
  #logs::-webkit-scrollbar, .table-wrap::-webkit-scrollbar { width: 8px; height: 8px; }
  #logs::-webkit-scrollbar-thumb, .table-wrap::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.14); border-radius: 4px; }
  #logs::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.22); }
  #logs::-webkit-scrollbar-track { background: transparent; }
  .log-line { display: block; }
  .log-err { color: #ff7b72; }
  .log-warn { color: #e3b341; }
  .log-speed { color: #56d364; }
  .log-event { color: #79c0ff; }
  .log-muted { color: #6e7681; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; }
  .tag.busy { background: rgba(52, 211, 153, .15); color: var(--ok); }
  .tag.idle { background: rgba(160, 160, 170, .15); color: var(--muted); }
  .tag.loaded { background: rgba(52, 211, 153, .15); color: var(--ok); }
  .tag.sleeping { background: rgba(245, 185, 66, .15); color: var(--warn); }
  .tag.loading { background: rgba(91, 140, 255, .15); color: var(--accent); }
  section { margin-bottom: 20px; }
  .muted { color: var(--muted); }
  .bar { height: 8px; background: rgba(255, 255, 255, 0.07); border-radius: 4px; margin-top: 8px; overflow: hidden; }
  .bar-fill { height: 100%; transition: width .3s; border-radius: 4px; }
  .bar-fill.accent { background: linear-gradient(90deg, #4f7cff, #7aa2ff); box-shadow: 0 0 8px rgba(91, 140, 255, 0.5); }
  .bar-fill.warn { background: linear-gradient(90deg, #e0a83a, #f5c76e); box-shadow: 0 0 8px rgba(245, 185, 66, 0.4); }
  .bar-fill.err { background: linear-gradient(90deg, #e04f4f, #f58a8a); box-shadow: 0 0 8px rgba(247, 92, 92, 0.4); }
  .err-bar { margin-top: 8px; padding: 6px 10px; border: 1px solid rgba(247, 92, 92, 0.5);
            background: rgba(247, 92, 92, 0.08); border-radius: 8px; color: #f5a3a3; font-size: 12px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  details summary:hover { color: var(--fg); }
  .header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
    padding: 10px 14px; margin: 0 -4px 16px;
    background: rgba(13, 16, 23, 0.72);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  }
  .header h1 { margin: 0; display: flex; align-items: center; gap: 10px; }
  .header .logo { width: 22px; height: 22px; flex-shrink: 0; }
  .bento-top {
    display: grid; grid-template-columns: 1.05fr 1fr; gap: 16px; align-items: stretch;
    margin-bottom: 20px;
  }
  .bento-top > section { display: flex; flex-direction: column; margin-bottom: 0; }
  .bento-top .card { flex: 1; height: auto; }
  @media (max-width: 900px) {
    .bento-top { grid-template-columns: 1fr; }
  }
  .gpu-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
  @media (max-width: 640px) {
    .gpu-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  .gpu-stat {
    background: rgba(9, 11, 16, 0.55); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 10px;
  }
  .gpu-stat .label { color: var(--muted); font-size: 11px; }
  .gpu-stat .value { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .gpu-stat .value .unit { font-size: 11px; color: var(--muted); margin-left: 4px; font-weight: 400; }
  .svc-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
  @media (max-width: 640px) {
    .svc-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  .svc-stat {
    background: rgba(9, 11, 16, 0.55); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 10px;
  }
  .svc-stat .label { color: var(--muted); font-size: 11px; }
  .svc-stat .value { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .svc-stat .value .unit { font-size: 11px; color: var(--muted); margin-left: 4px; font-weight: 400; }
  #proc-cmd {
    margin-top: 10px; padding: 6px 12px; min-height: 22px;
    background: rgba(9, 11, 16, 0.55); border: 1px solid var(--border);
    border-radius: 999px;
    font-family: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
    font-size: 12px; line-height: 1.4;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .model-row {
    background: rgba(9, 11, 16, 0.5); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    transition: border-color .15s ease, background .15s ease;
  }
  .model-row + .model-row { margin-top: 8px; }
  .model-row:hover { border-color: var(--border-strong); background: rgba(13, 17, 25, 0.65); }
  .model-row.is-loaded {
    border-left: 3px solid var(--ok);
    background: rgba(52, 211, 153, 0.06);
  }
  .sleep-bar {
    margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .ram-bar {
    margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .ram-bar .bar { flex: 1 1 120px; margin-top: 0; }
  .ram-bar .ram-val { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .legend-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 5px; vertical-align: baseline;
  }
  .trend-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
               gap: 12px; margin-top: 12px; }
  .trend-grid.single { grid-template-columns: 1fr; }
  @media (max-width: 768px) {
    .trend-grid { grid-template-columns: 1fr; }
  }
  .trend-svg { width: 100%; height: auto; display: block; }
  .trend-legend { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .trend-legend span { margin-right: 12px; }
  .trend-legend b { color: var(--fg); font-weight: 500; }
  #slot-table th, #slot-table td { white-space: nowrap; }
  select, input[type="search"] {
    background: rgba(9, 11, 16, 0.6); color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 5px 10px; font-size: 12px;
    transition: border-color .15s ease, background .15s ease;
  }
  select:hover, input[type="search"]:hover { border-color: var(--border-strong); }
  select:focus, input[type="search"]:focus {
    outline: none; border-color: rgba(91, 140, 255, 0.6);
    box-shadow: 0 0 0 3px rgba(91, 140, 255, 0.12);
  }
  select option { background: #12161f; color: var(--fg); }
  .log-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .log-toolbar input[type="search"] { width: 160px; }
  .log-f { padding: 4px 10px; font-size: 12px; }
  .log-f.active {
    background: var(--accent-soft); border-color: rgba(91, 140, 255, 0.55); color: #c7d7ff;
  }
  #chat-input {
    background: rgba(9, 11, 16, 0.6); color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 5px 10px; font-size: 13px;
    transition: border-color .15s ease, background .15s ease;
  }
  #chat-input:hover { border-color: var(--border-strong); }
  #chat-input:focus { outline: none; border-color: rgba(91, 140, 255, 0.6);
    box-shadow: 0 0 0 3px rgba(91, 140, 255, 0.12); }
  #chat-out { white-space: pre-wrap; font-size: 13px; }
  .chat-pill { display: inline-block; padding: 1px 8px; border-radius: 10px;
    font-size: 12px; background: rgba(91, 140, 255, 0.12); color: var(--accent);
    margin-right: 6px; margin-bottom: 4px; }
  .hidden { display: none !important; }
  #confirm-modal {
    position: fixed; inset: 0;
    background: rgba(5, 7, 12, 0.55);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  #confirm-modal .card { width: min(420px, calc(100vw - 32px)); }
  #confirm-msg { margin-bottom: 12px; }
  #confirm-actions { justify-content: flex-end; }
  #tune-modal {
    position: fixed; inset: 0;
    background: rgba(5, 7, 12, 0.55);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  #tune-modal .card { width: min(440px, calc(100vw - 32px)); }
  #tune-model { font-size: 15px; font-weight: 600; margin-top: 4px; word-break: break-all; }
  .tune-fields { display: grid; gap: 10px; margin-top: 12px; }
  .tune-fields label {
    display: flex; flex-direction: column; gap: 4px;
    font-size: 12px; color: var(--muted);
  }
  .tune-fields input, .tune-fields select {
    background: rgba(9, 11, 16, 0.6); color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; font-size: 13px;
    transition: border-color .15s ease, background .15s ease;
  }
  .tune-fields input:hover, .tune-fields select:hover { border-color: var(--border-strong); }
  .tune-fields input:focus, .tune-fields select:focus {
    outline: none; border-color: rgba(91, 140, 255, 0.6);
    box-shadow: 0 0 0 3px rgba(91, 140, 255, 0.12);
  }
  #tune-err { margin-top: 10px; }
  .trace-item {
    background: rgba(9, 11, 16, 0.55); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px;
    transition: border-color .15s ease, background .15s ease;
  }
  .trace-item + .trace-item { margin-top: 8px; }
  .trace-item:hover { border-color: var(--border-strong); background: rgba(13, 17, 25, 0.65); }
  .trace-item > summary {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 0;
  }
  .trace-time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .trace-preview {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--muted); font-size: 12px;
  }
  .trace-pills { margin-left: auto; display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .trace-pills .chat-pill { margin: 0; }
  .trace-body { margin-top: 10px; display: grid; gap: 10px; }
  .trace-sub > summary { font-size: 12px; }
  .trace-msg { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 6px; }
  .trace-role { flex-shrink: 0; background: rgba(160, 160, 170, .15); color: var(--muted); }
  .trace-msg-text { white-space: pre-wrap; font-size: 12px; min-width: 0; }
  .trace-block {
    background: rgba(2, 4, 8, 0.75); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font: 12px/1.6 ui-monospace, Consolas, monospace;
    white-space: pre-wrap; word-break: break-word;
  }
  .trace-label { color: var(--muted); font-size: 12px; }
  .trace-tool { display: grid; gap: 4px; }
  .trace-empty { padding: 10px 4px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>
      <svg class="logo" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="logo-grad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
            <stop stop-color="#7aa2ff"/><stop offset="1" stop-color="#22d3ee"/>
          </linearGradient>
        </defs>
        <rect x="5" y="5" width="14" height="14" rx="3" stroke="url(#logo-grad)" stroke-width="1.5"/>
        <rect x="9.5" y="9.5" width="5" height="5" rx="1.2" fill="url(#logo-grad)"/>
        <path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3" stroke="url(#logo-grad)" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span class="dot" id="dot"></span>
      llama.cpp 控制面板
    </h1>
    <div class="row">
      <span class="muted" id="last-refresh"></span>
      <button id="btn-refresh">刷新</button>
    </div>
  </div>

  <div class="bento-top">
    <section>
      <h2>服务</h2>
      <div class="card">
        <div class="row">
          <span class="dot" id="proc-dot"></span>
          <span id="proc-state" class="muted">…</span>
          <span style="flex:1"></span>
          <span class="actions">
            <button id="btn-start">启动</button>
            <button id="btn-stop" class="danger">停止</button>
            <button id="btn-restart">重启</button>
          </span>
        </div>
        <div class="sub" id="proc-cmd"></div>
        <div class="svc-stats" id="proc-stats"></div>
        <div id="proc-ram"></div>
        <div class="err-bar" id="proc-err" hidden></div>
      </div>
    </section>

    <section>
      <h2>显卡 / VRAM</h2>
      <div class="card" id="gpu-card"><span class="muted">加载中…</span></div>
    </section>
  </div>

  <section>
    <h2>模型</h2>
    <div class="card" id="model-card"><span class="muted">加载中…</span></div>
    <div class="card" style="margin-top:12px">
      <details id="chat-box">
        <summary>快捷试跑（发一句话验货）</summary>
        <div class="row" style="margin-top:8px">
          <select id="chat-model" style="flex:1;min-width:0"></select>
          <input id="chat-input" type="text" placeholder="输入测试提示词，回车发送…" style="flex:2;min-width:120px">
          <button id="btn-chat-send" class="btn-primary">发送</button>
          <button id="btn-chat-stop" class="danger hidden">停止</button>
        </div>
        <div id="chat-out" style="margin-top:10px"></div>
      </details>
    </div>
  </section>

  <section id="power-section" class="hidden">
    <h2>电源模式</h2>
    <div class="card" id="power-card"><span class="muted">加载中…</span></div>
  </section>

  <section>
    <h2>指标</h2>
    <div class="metrics-grid" id="metric-cards"></div>

<script>
const $ = (id) => document.getElementById(id);
let lastProc = null; // 最近一次状态里的进程信息（供日志区提示用）
let busy = false;   // 启停/重启请求进行中（防连点）
let lastHealth = false; // server 是否健康（测速按钮可用性）
let probing = false;    // 测速请求进行中
let probeResultHtml = ""; // 测速结果展示
let modelBusy = null;   // 模型加载/卸载进行中：null | "loading" | "unloading"
let modelErrHtml = "";  // 模型卡操作错误内联展示
let sleepIdleSel = null; // 空闲自动卸载下拉框选中值（null=跟随后端当前值）
let presetEditable = false; // 是否配置了 --models-preset（显示调参入口）
let tuneModel = null;    // 调参弹窗当前目标模型
let logLines = [];    // 最近一次拉取的日志行
let logFilter = "all"; // all | warn | speed
let logSearch = "";
let logPaused = false;
let logN = 200;
const LOG_FILTERS = {
  warn: / W | E |error|warn/i,
  speed: /print_timing|eval time|draft acceptance/i,
};

// 按基础名查找指标（兼容带标签的变体）
function metricValue(metrics, name) {
  if (!metrics) return null;
  if (name in metrics) return metrics[name];
  for (const k of Object.keys(metrics)) {
    if (k.startsWith(name + "{")) return metrics[k];
  }
  return null;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function fmtNum(v) {
  if (v === null || v === undefined) return "—";
  if (typeof v === "number") {
    const n = Math.abs(v) >= 1000 ? v.toLocaleString(undefined, {maximumFractionDigits: 0})
              : Number.isInteger(v) ? v.toLocaleString()
              : v.toFixed(2);
    return n;
  }
  return String(v);
}

function fmt(v, unit = "") {
  if (v === null || v === undefined) return "—";
  return fmtNum(v) + unit;
}

function fmtUptime(s) {
  if (s === null || s === undefined) return "—";
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h}h ${m}m` : m ? `${m}m ${Math.floor(s % 60)}s` : `${Math.floor(s)}s`;
}

function fmtBig(n) {
  if (n === null || n === undefined) return null;
  if (n >= 1e9) return (n / 1e9).toFixed(1) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  return String(n);
}

function fmtBytes(n) {
  if (n === null || n === undefined) return null;
  if (n >= 1e9) return (n / 1e9).toFixed(1) + " GB";
  if (n >= 1e6) return (n / 1e6).toFixed(1) + " MB";
  return String(n) + " B";
}

function modelId(models) {
  const d = models?.data;
  return Array.isArray(d) && d.length ? d[0].id : null;
}

function fmtSleep(s) {
  if (s >= 3600) return `${Math.round(s / 3600)}h`;
  if (s >= 60) return `${Math.round(s / 60)}m`;
  return `${s}s`;
}

function specAccept(m) {
  if (!m) return null;
  const acc = metricValue(m, "llamacpp:spec_decode_num_accepted_tokens_total");
  const draft = metricValue(m, "llamacpp:spec_decode_num_draft_tokens_total");
  if (acc === null || draft === null || draft === 0) return null;
  return acc / draft * 100;
}

function kvHit(m) {
  if (!m) return null;
  const cached = metricValue(m, "llamacpp:prompt_tokens_cached_total");
  const prompt = metricValue(m, "llamacpp:prompt_tokens_total");
  if (cached === null || prompt === null) return null;
  const total = cached + prompt;
  if (total <= 0) return null;
  return cached / total * 100;
}

// 新版 llama.cpp 的 gauge（*_tokens_seconds）恒为 0，真实数据在累计计数器里：
// 优先用 gauge，否则用 tokens_total / seconds_total 计算平均速度
function genSpeed(m) {
  if (!m) return null;
  const gauge = metricValue(m, "llamacpp:predicted_tokens_seconds");
  if (typeof gauge === "number" && gauge > 0) return gauge;
  const tokens = metricValue(m, "llamacpp:tokens_predicted_total");
  const seconds = metricValue(m, "llamacpp:tokens_predicted_seconds_total");
  if (typeof seconds === "number" && seconds > 0 && typeof tokens === "number" && tokens >= 0) {
    return tokens / seconds;
  }
  if (gauge === 0) return 0;
  return null;
}

function promptSpeed(m) {
  if (!m) return null;
  const gauge = metricValue(m, "llamacpp:prompt_tokens_seconds");
  if (typeof gauge === "number" && gauge > 0) return gauge;
  const tokens = metricValue(m, "llamacpp:prompt_tokens_total");
  const seconds = metricValue(m, "llamacpp:prompt_seconds_total");
  if (typeof seconds === "number" && seconds > 0 && typeof tokens === "number" && tokens >= 0) {
    return tokens / seconds;
  }
  if (gauge === 0) return 0;
  return null;
}

function cardHtml(label, value, unit) {
  if (value === null || value === undefined) {
    return `<div class="card"><div class="label">${label}</div>
    <div class="value">—</div></div>`;
  }
  const u = unit ? `<span class="unit">${unit}</span>` : "";
  return `<div class="card"><div class="label">${label}</div>
    <div class="value">${fmtNum(value)}${u}</div></div>`;
}

// ---- 实时趋势（最近 60 个采样点 ≈ 2 分钟）----
const TREND_MAX = 60;
const trend = { gen: [], prompt: [], vram: [], temp: [] };

// 上一次观测到的累计计数器（模型重启计数器变小时自动重置）
let prevGenCounters = null;    // [tokens_predicted_total, tokens_predicted_seconds_total]
let prevPromptCounters = null; // [prompt_tokens_total, prompt_seconds_total]

function counterDeltaSpeed(prev, curTokens, curSeconds) {
  if (curTokens === null || curTokens === undefined ||
      curSeconds === null || curSeconds === undefined) return [null, prev];
  if (prev === null || curTokens < prev[0]) return [null, [curTokens, curSeconds]];
  const dSec = curSeconds - prev[1];
  const dTok = curTokens - prev[0];
  const speed = (dSec > 0 && dTok >= 0) ? dTok / dSec : null;
  return [speed, [curTokens, curSeconds]];
}

function pushTrend(m, g) {
  let gen = null, prompt = null;
  if (m) {
    const [gs, genPrev] = counterDeltaSpeed(prevGenCounters,
      metricValue(m, "llamacpp:tokens_predicted_total"),
      metricValue(m, "llamacpp:tokens_predicted_seconds_total"));
    prevGenCounters = genPrev;
    const [ps, promptPrev] = counterDeltaSpeed(prevPromptCounters,
      metricValue(m, "llamacpp:prompt_tokens_total"),
      metricValue(m, "llamacpp:prompt_seconds_total"));
    prevPromptCounters = promptPrev;
    gen = gs !== null ? gs : genSpeed(m);
    prompt = ps !== null ? ps : promptSpeed(m);
  }
  trend.gen.push(gen);
  trend.prompt.push(prompt);
  trend.vram.push(g && g.vram_percent !== null && g.vram_percent !== undefined ? g.vram_percent : null);
  trend.temp.push(g && g.temp_c !== null && g.temp_c !== undefined ? g.temp_c : null);
  for (const k of Object.keys(trend)) {
    if (trend[k].length > TREND_MAX) trend[k].shift();
  }
}

function trendLines(series) {
  const W = 400, H = 110, P = 6;
  let max = 0;
  for (const s of series) for (const v of s.data) if (v !== null && v > max) max = v;
  const ceiling = max > 0 ? max * 1.15 : 1;
  const x = (i) => P + i * (W - 2 * P) / (TREND_MAX - 1);
  const y = (v) => H - P - (v / ceiling) * (H - 2 * P);
  let out = "";
  for (let f = 0; f <= 4; f++) {
    const gy = (P + (f * (H - 2 * P)) / 4).toFixed(1);
    out += `<line x1="${P}" y1="${gy}" x2="${W - P}" y2="${gy}" stroke="#30363d" stroke-width="0.5" opacity="0.5"/>`;
  }
  for (const s of series) {
    let seg = [], segs = [];
    s.data.forEach((v, i) => {
      if (v === null) { if (seg.length) segs.push(seg); seg = []; }
      else seg.push([x(i), y(v)]);
    });
    if (seg.length) segs.push(seg);
    for (const sg of segs) {
      const d = sg.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
      if (sg.length > 1) {
        out += `<path d="${d} L${sg[sg.length - 1][0].toFixed(1)} ${H - P} L${sg[0][0].toFixed(1)} ${H - P} Z" fill="${s.color}" opacity="0.12"/>`;
      }
      out += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="1.5"/>`;
    }
  }
  return out;
}

function trendLegend(series) {
  return series.map((s) => {
    const vals = s.data.filter((v) => v !== null);
    const last = vals.length ? vals[vals.length - 1] : null;
    const peak = vals.length ? Math.max(...vals) : null;
    return `<span><i class="legend-dot" style="background:${s.color}"></i>${s.name} <b>${last === null ? "—" : s.fmt(last)}</b> · 峰值 ${peak === null ? "—" : s.fmt(peak)}</span>`;
  }).join("");
}

function renderTrends() {
  const genSeries = [
    { name: "生成速度", color: "var(--ok)", data: trend.gen, fmt: (v) => v.toFixed(1) + " tok/s" },
    { name: "提示词速度", color: "var(--accent)", data: trend.prompt, fmt: (v) => v.toFixed(0) + " tok/s" },
  ];
  $("svg-throughput").innerHTML = trendLines(genSeries);
  $("legend-throughput").innerHTML = trendLegend(genSeries);
  const gpuHas = trend.vram.some((v) => v !== null) || trend.temp.some((v) => v !== null);
  $("trend-gpu").style.display = gpuHas ? "" : "none";
  $("trend-grid").classList.toggle("single", !gpuHas);
  if (gpuHas) {
    const gpuSeries = [
      { name: "VRAM 占用", color: "var(--warn)", data: trend.vram, fmt: (v) => v.toFixed(1) + "%" },
      { name: "GPU 温度", color: "var(--accent)", data: trend.temp, fmt: (v) => v.toFixed(0) + "°C" },
    ];
    $("svg-gpu").innerHTML = trendLines(gpuSeries);
    $("legend-gpu").innerHTML = trendLegend(gpuSeries);
  }
}

function renderGpu(g) {
  const el = $("gpu-card");
  if (!g) {
    el.innerHTML = `<span class="muted">无 GPU 信息（未检测到 rocm-smi / nvidia-smi，或无 GPU）</span>`;
    return;
  }
  const pct = g.vram_percent;
  const cls = pct === null ? "accent" : pct > 95 ? "err" : pct > 85 ? "warn" : "accent";
  const bar = pct === null ? "" :
    `<div class="bar"><div class="bar-fill ${cls}" style="width:${Math.min(100, pct)}%"></div></div>`;
  const stats = [
    ["VRAM", `${fmtBytes(g.vram_used_bytes)} / ${fmtBytes(g.vram_total_bytes)}`, pct !== null ? `${pct.toFixed(1)}%` : "—"],
    ["利用率", g.gpu_util_percent !== null ? g.gpu_util_percent.toFixed(0) : "—", "%"],
    ["温度", g.temp_c !== null ? g.temp_c.toFixed(0) : "—", "°C"],
    ["功耗", g.power_w !== null ? g.power_w.toFixed(1) : "—", "W"],
  ].map(([l, v, u]) =>
    `<div class="gpu-stat"><div class="label">${l}</div><div class="value">${v}<span class="unit">${u}</span></div></div>`
  ).join("");
  let capBar = "";
  if (g.power_cap && g.power_cap.writable) {
    const pc = g.power_cap;
    const mid = Math.round(((pc.min_w + pc.max_w) / 2) / 10) * 10;
    const tiers = [
      [pc.min_w, `${pc.min_w}W 静音`],
      [mid, `${mid}W 平衡`],
      [pc.max_w, `${pc.max_w}W 满血`],
    ];
    capBar = `<div class="row sleep-bar" style="justify-content:space-between">
      <span class="label">功耗上限</span>
      <div class="seg" style="margin-left:auto">${tiers.map(([w, l]) =>
        `<button class="gpu-cap-btn${Math.abs(pc.current_w - w) <= 5 ? " active" : ""}"
             data-watts="${w}">${l}</button>`).join("")}</div>
      <span class="gpu-cap-err" id="gpu-cap-err"></span>
    </div>`;
  }
  el.innerHTML = `<div class="label">显卡</div>
    <div class="value" style="font-size:16px">${escHtml(g.name)}</div>
    ${bar}
    <div class="gpu-stats">${stats}</div>
    ${capBar}`;
  if (capBar) {
    el.querySelectorAll(".gpu-cap-btn").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const errEl = $("gpu-cap-err");
        if (errEl) errEl.textContent = "";
        const watts = parseInt(btn.dataset.watts, 10);
        try {
          const r = await fetch("/api/gpu/power-cap", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ watts }),
          });
          const d = await r.json();
          if (!d.ok) {
            if (errEl) errEl.textContent = d.error || "设置失败";
            return;
          }
          fetchStatus();
        } catch (e) {
          if (errEl) errEl.textContent = `请求失败: ${e}`;
        }
      });
    });
  }
}

// ---- 多模型 Router：单行渲染 ----
function modelRowHtml(m) {
  const state = m.state || "none";
  const badge = state === "loaded"
    ? `<span class="tag loaded">已加载</span>`
    : state === "unloaded"
      ? `<span class="tag sleeping">休眠中</span>`
      : state === "loading"
        ? `<span class="tag loading">加载中…</span>`
        : "";
  const vision = (m.modalities || []).includes("image")
    ? `<span class="tag" style="background:rgba(88,166,255,.15);color:var(--accent)">视觉</span>` : "";
  const meta = m.meta || {};
  const sub = state === "unloaded"
    ? "显存已释放，收到请求将自动唤醒"
    : [
        meta.n_ctx ? `n_ctx ${fmt(meta.n_ctx)}` : null,
        meta.ftype || null,
        meta.n_params ? `${fmtBig(meta.n_params)} 参数` : null,
        meta.size ? fmtBytes(meta.size) : null,
      ].filter(Boolean).join(" · ") || "—";
  const inAction = modelBusy !== null;
  const btnLoad = state !== "loaded"
    ? `<button class="mm-load" data-model="${escHtml(m.id)}" ${inAction || state === "loading" ? "disabled" : ""}>加载</button>`
    : "";
  const btnUnload = state !== "unloaded"
    ? `<button class="mm-unload danger" data-model="${escHtml(m.id)}" ${inAction || state === "loading" ? "disabled" : ""}>卸载</button>`
    : "";
  const btnProbe = `<button class="mm-probe" data-model="${escHtml(m.id)}" ${probing || inAction || !lastHealth ? "disabled" : ""}>测速</button>`;
  const btnTune = presetEditable
    ? `<button class="mm-tune" data-model="${escHtml(m.id)}">调参</button>`
    : "";
  return `<div class="model-row ${state === "loaded" ? "is-loaded" : ""}">
    <div style="flex:1;min-width:0">
      <div class="value" style="font-size:14px">${escHtml(m.id)} ${badge} ${vision}</div>
      <div class="sub">${sub}</div>
    </div>
    <span class="actions">${btnLoad}${btnUnload}${btnProbe}${btnTune}</span>
  </div>`;
}

// ---- 电源模式 ----
function renderPower(p) {
  const section = $("power-section");
  const el = $("power-card");
  if (!p) { section.classList.add("hidden"); return; }
  section.classList.remove("hidden");
  const cur = p.current;
  const avail = p.available || [];
  const nameMap = { "power-saver": "省电", "balanced": "平衡", "performance": "性能" };
  const descMap = { "power-saver": "低功耗静音", "balanced": "兼顾性能与功耗", "performance": "满载性能优先" };
  const btns = avail.length
    ? avail.map((name) =>
        `<button class="power-btn ${name === cur ? "active" : ""}" data-profile="${name}">${nameMap[name] || name}</button>`
      ).join("")
    : `<span class="muted">（无可用档位）</span>`;
  el.innerHTML = `
    <div class="power-row">
      <div class="power-info">
        <span class="power-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#9db4ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg></span>
        <div>
          <div class="power-title">当前档位：${nameMap[cur] || cur || "未知"}</div>
          <div class="power-desc">${descMap[cur] || ""}</div>
        </div>
      </div>
      <div class="seg">${btns}</div>
    </div>
    <div id="power-err"></div>`;
}

async function setPowerProfile(profile) {
  const errEl = $("power-err");
  if (errEl) errEl.innerHTML = "";
  try {
    const r = await fetch("/api/power/profile", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ profile }),
    });
    const d = await r.json();
    if (!d.ok) errEl.innerHTML = `<div class="err-bar">${escHtml(d.error || `请求失败（HTTP ${r.status}）`)}</div>`;
  } catch (e) {
    if (errEl) errEl.innerHTML = `<div class="err-bar">${escHtml(`请求失败: ${e}`)}</div>`;
  }
  fetchStatus();
}

async function applySleepIdle() {
  const sel = $("sel-sleep-idle");
  if (!sel) return;
  const seconds = parseInt(sel.value, 10);
  if (!(await askConfirm("确认修改空闲自动卸载时长并重启服务？"))) return;
  const btn = $("btn-apply-sleep-idle");
  if (btn) btn.disabled = true;
  modelErrHtml = "";
  try {
    const r = await fetch("/api/preset/sleep-idle", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ seconds, restart: true }),
    });
    const d = await r.json();
    if (!d.ok) modelErrHtml = `<span style="color:var(--err)">${escHtml(d.error || `请求失败（HTTP ${r.status}）`)}</span>`;
    else sleepIdleSel = null;
  } catch (e) {
    modelErrHtml = `<span style="color:var(--err)">${escHtml(`请求失败: ${e}`)}</span>`;
  }
  const b = $("btn-apply-sleep-idle");
  if (b) b.disabled = false;
  fetchStatus();
}

function renderStatus(data) {
  const s = data.server, p = s.process;
  lastProc = p;
  presetEditable = !!s.preset_editable;
  lastHealth = !!s.health;
  $("dot").className = "dot" + (s.health ? " on" : "");
  $("proc-dot").className = "dot" + (p.running ? " on" : "");
  $("proc-state").textContent = p.running
    ? (p.external
        ? `运行中（外部）· PID ${p.pid}`
        : `运行中 · PID ${p.pid}${p.uptime !== null && p.uptime !== undefined ? ` · ${fmtUptime(p.uptime)}` : ""}`)
    : "未运行";
  const cmdText = p.external ? "（外部启动，非面板拉起）" : p.command.join(" ");
  const cmdEl = $("proc-cmd");
  cmdEl.textContent = cmdText;
  cmdEl.title = cmdText;
  if (!busy) {
    $("btn-start").disabled = p.running;
    $("btn-stop").disabled = !p.running;
  }

  // 模型（Router 模式：状态徽章 + 休眠策略 + 加载/卸载操作）
  const mid = modelId(s.models);
  const ms = s.model_state || {};
  const router = !!ms.router_mode;
  const mstate = ms.state || "none";
  const meta = s.models?.data?.[0]?.meta || {};
  const modelsList = s.models_list || [];
  const inAction = modelBusy !== null;

  let modelContent;
  if (modelsList.length > 1) {
    // 多模型 Router：每模型一行
    modelContent = `<div class="label">模型（多模型 Router）</div>`
      + modelsList.map(modelRowHtml).join("");
  } else {
    const badge = mstate === "loaded"
      ? `<span class="tag loaded">已加载</span>`
      : mstate === "unloaded"
        ? `<span class="tag sleeping">休眠中（已卸载）</span>`
        : mstate === "loading"
          ? `<span class="tag loading">加载中…</span>`
          : "";
    const subParts = mstate === "unloaded"
      ? ["显存已释放，收到请求将自动唤醒"]
      : [
          `n_ctx ${fmt(meta.n_ctx)}`,
          meta.ftype || null,
          meta.n_params ? `${fmtBig(meta.n_params)} 参数` : null,
          meta.size ? fmtBytes(meta.size) : null,
        ];
    if (ms.sleep_idle_seconds) subParts.push(`空闲 ${fmtSleep(ms.sleep_idle_seconds)} 自动卸载`);
    const subs = subParts.filter(Boolean);
    const btnLoad = router && mstate !== "loaded"
      ? `<button id="btn-load-model" ${inAction || mstate === "loading" ? "disabled" : ""}>${modelBusy === "loading" ? "加载中…" : "加载模型"}</button>`
      : "";
    const btnUnload = router && mstate !== "unloaded"
      ? `<button id="btn-unload-model" class="danger" ${inAction || mstate === "loading" ? "disabled" : ""}>${modelBusy === "unloading" ? "卸载中…" : "卸载模型"}</button>`
      : "";
    const btnTune = presetEditable && mid
      ? `<button class="mm-tune" data-model="${escHtml(mid)}">调参</button>`
      : "";
    modelContent = mid
      ? `<div class="row">
           <div style="flex:1;min-width:0">
             <div class="label">模型</div>
             <div class="value" style="font-size:16px">${escHtml(mid)} ${badge}</div>
             <div class="sub">${subs.join(" · ")}</div>
           </div>
           <span class="actions">
             ${btnLoad}
             ${btnUnload}
             <button id="btn-probe" ${probing || inAction || !s.health ? "disabled" : ""}>${probing ? "测速中…" : "快速测速"}</button>
             ${btnTune}
           </span>
         </div>`
      : `<span class="muted">无模型信息（服务未启动或未加载模型）</span>`;
  }

  // 空闲自动卸载（在线编辑 models.ini 预设）
  let sleepIdleHtml = "";
  if (s.preset_editable) {
    const cur = sleepIdleSel !== null ? sleepIdleSel : ms.sleep_idle_seconds;
    const opts = [[300, "5分钟"], [600, "10分钟"], [1800, "30分钟"], [3600, "60分钟"], [-1, "关闭"]];
    if (cur !== null && cur !== undefined && !opts.some(([v]) => v === cur)) {
      opts.push([cur, fmtSleep(cur)]);
    }
    sleepIdleHtml = `<div class="row sleep-bar">
      <span class="label">空闲自动卸载</span>
      <select id="sel-sleep-idle">
        ${opts.map(([v, l]) => `<option value="${v}" ${cur === v ? "selected" : ""}>${l}</option>`).join("")}
      </select>
      <button id="btn-apply-sleep-idle">应用并重启</button>
    </div>`;
  }

  $("model-card").innerHTML = modelContent
    + `<div class="sub" id="model-action-err">${modelErrHtml}</div>`
    + `<div class="sub" id="probe-result">${probeResultHtml}</div>`
    + sleepIdleHtml;

  // 快捷试跑：同步模型下拉（保留用户已选值；单模型则填当前 mid）
  syncChatModel(modelsList, mid);

  // 显卡 / VRAM
  renderGpu(data.gpu);

  // 电源模式（非 Linux 或无工具时 power 为 null，整卡隐藏）
  renderPower(data.power);

  // 指标卡：固定 4×2 布局
  const m = data.metrics;
  const processing = m ? metricValue(m, "llamacpp:requests_processing") : null;
  const deferred = m ? metricValue(m, "llamacpp:requests_deferred") : null;
  const cards = [
    ["生成速度", genSpeed(m), "tok/s"],
    ["提示词速度", promptSpeed(m), "tok/s"],
    ["spec 接受率", specAccept(m), "%"],
    ["KV 缓存命中率", kvHit(m), "%"],
    ["上下文高水位", m ? metricValue(m, "llamacpp:n_tokens_max") : null, "tok"],
    ["处理中 / 排队",
     processing === null && deferred === null ? null :
       `${fmtNum(processing)} / ${fmtNum(deferred)}`, ""],
    ["提示词 tokens 累计", m ? metricValue(m, "llamacpp:prompt_tokens_total") : null, ""],
    ["生成 tokens 累计", m ? metricValue(m, "llamacpp:tokens_predicted_total") : null, ""],
  ];
  $("metric-cards").innerHTML = cards.map(([l, v, u]) => cardHtml(l, v, u)).join("");

  // 实时趋势
  pushTrend(m, data.gpu);
  renderTrends();

  // 全量指标表（折叠）
  const count = m ? Object.keys(m).length : 0;
  $("metric-details").querySelector("summary").textContent = `全量指标（${count}）`;
  $("metric-table").querySelector("tbody").innerHTML = m
    ? Object.entries(m).map(([k, v]) =>
        `<tr><td><code>${k}</code></td><td>${fmt(v)}</td></tr>`).join("")
    : mstate === "unloaded"
      ? `<tr><td colspan="2" class="muted">模型已休眠卸载（点击「加载模型」或发起请求后恢复）</td></tr>`
      : `<tr><td colspan="2" class="muted">无指标（服务端需加 --metrics 启动）</td></tr>`;

  // 槽位
  const slots = data.slots || [];
  $("slot-table").querySelector("tbody").innerHTML = slots.length
    ? slots.map(slotRows).join("")
    : mstate === "unloaded"
      ? `<tr><td colspan="7" class="muted">模型已休眠卸载（点击「加载模型」或发起请求后恢复）</td></tr>`
      : `<tr><td colspan="7" class="muted">无槽位</td></tr>`;

  // 服务遥测 2×2（与右侧 GPU 卡视觉对称）
  const healthColor = s.health ? "var(--ok)" : "var(--err)";
  const hostSrc = p.external ? "外部进程"
    : (p.command && p.command[0] && /^systemd:/.test(p.command[0])) ? "systemd 托管"
    : "面板拉起";
  const loadedN = modelsList.filter((m) => (m.state || "none") === "loaded").length;
  const totalModels = modelsList.length || (mid ? 1 : 0);
  const busyN = slots.filter((x) => x.is_processing).length;
  $("proc-stats").innerHTML = [
    ["接口健康", `<span style="color:${healthColor}">${s.health ? "健康" : "离线"}</span>`, router ? "Router 模式" : "单模型"],
    ["托管方式", p.running ? escHtml(hostSrc) : "—", p.running ? `PID ${p.pid ?? "—"}` : ""],
    ["运行时长", p.running ? fmtUptime(p.uptime) : "未运行", ""],
    ["模型 / 槽位", p.running ? `${loadedN} / ${totalModels} 已加载` : "—", p.running ? `${busyN} / ${slots.length} 槽位忙` : ""],
  ].map(([l, v, u]) =>
    `<div class="svc-stat"><div class="label">${l}</div><div class="value">${v}${u ? `<span class="unit">${u}</span>` : ""}</div></div>`
  ).join("");

  // 整机内存（Linux /proc/meminfo；非 Linux 时 memory 为 null，整行隐藏）
  const mem = data.memory;
  const ramEl = $("proc-ram");
  if (mem) {
    const cls = mem.percent > 92 ? "err" : mem.percent > 80 ? "warn" : "accent";
    const gib = (b) => (b / 1073741824).toFixed(1);
    let txt = `${gib(mem.used_bytes)} / ${gib(mem.total_bytes)} GiB（${mem.percent.toFixed(1)}%）`;
    if (mem.swap_used_bytes >= 10 * 1024 * 1024) {
      txt += ` · Swap ${mem.swap_used_bytes < 0.1 * 1073741824 ? (mem.swap_used_bytes / 1073741824).toFixed(2) : gib(mem.swap_used_bytes)} GiB`;
    }
    ramEl.innerHTML = `<div class="row ram-bar">
      <span class="label">系统内存</span>
      <div class="bar"><div class="bar-fill ${cls}" style="width:${Math.min(100, mem.percent)}%"></div></div>
      <span class="ram-val">${txt}</span>
    </div>`;
  } else {
    ramEl.innerHTML = "";
  }
}

function slotRows(s) {
  const sp = s.speed || {};
  const n_decoded = s.n_decoded ?? sp.decoded_n ?? (s.next_token?.[0]?.n_decoded ?? null);
  const busy = s.is_processing;
  return `<tr>
    <td>${s.id ?? "?"}</td>
    <td><span class="tag ${busy ? "busy" : "idle"}">${busy ? "处理中" : "空闲"}</span></td>
    <td>${fmt(s.n_ctx)}</td>
    <td>${fmt(s.n_prompt_tokens ?? sp.prompt_n)}</td>
    <td>${fmt(n_decoded)}</td>
    <td>${fmt(sp.prompt_n_per_second, " tok/s")}</td>
    <td>${fmt(sp.decoded_n_per_second, " tok/s")}</td>
  </tr>`;
}

function setBusy(b) {
  busy = b;
  for (const id of ["btn-start", "btn-stop", "btn-restart"]) $(id).disabled = b;
}

function showErr(msg) {
  const el = $("proc-err");
  el.hidden = !msg;
  el.textContent = msg || "";
}

// ---- 页面内确认弹窗（替代原生 confirm，兼容内置 WebView）----
let confirmResolve = null;
function askConfirm(msg) {
  return new Promise((resolve) => {
    confirmResolve = resolve;
    $("confirm-msg").textContent = msg;
    $("confirm-modal").classList.remove("hidden");
  });
}
function closeConfirm(result) {
  $("confirm-modal").classList.add("hidden");
  if (confirmResolve) { confirmResolve(result); confirmResolve = null; }
}
$("confirm-ok").onclick = () => closeConfirm(true);
$("confirm-cancel").onclick = () => closeConfirm(false);
$("confirm-modal").onclick = (e) => { if (e.target === $("confirm-modal")) closeConfirm(false); };
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("confirm-modal").classList.contains("hidden")) closeConfirm(false);
  if (e.key === "Escape" && !$("tune-modal").classList.contains("hidden")) closeTune();
});

// ---- 单模型参数在线微调（models.ini 预设）----
function setTuneErr(msg) {
  const el = $("tune-err");
  el.classList.toggle("hidden", !msg);
  el.textContent = msg || "";
}
function closeTune() {
  $("tune-modal").classList.add("hidden");
  tuneModel = null;
}
async function openTune(model) {
  tuneModel = model;
  $("tune-model").textContent = model;
  setTuneErr("");
  try {
    const r = await fetch(`/api/preset/model/${encodeURIComponent(model)}`);
    const d = await r.json();
    if (!d.ok) {
      setTuneErr(d.error || `请求失败（HTTP ${r.status}）`);
      tuneModel = null;
      return;
    }
    const p = d.params || {};
    $("tune-temp").value = p["temp"] ?? "";
    $("tune-ctx").value = p["ctx-size"] ?? "";
    $("tune-budget").value = p["reasoning-budget"] ?? "";
    $("tune-effort").value = p["reasoning-effort"] ?? "";
  } catch (e) {
    setTuneErr(`请求失败: ${e}`);
  }
  $("tune-modal").classList.remove("hidden");
}
async function saveTune() {
  if (!tuneModel) return;
  const numOrNull = (id) => {
    const v = $(id).value.trim();
    return v === "" ? null : Number(v);
  };
  const body = {
    params: {
      "temp": numOrNull("tune-temp"),
      "ctx-size": numOrNull("tune-ctx"),
      "reasoning-budget": numOrNull("tune-budget"),
      "reasoning-effort": $("tune-effort").value || null,
    },
    restart: true,
  };
  const btn = $("tune-save");
  btn.disabled = true;
  setTuneErr("");
  try {
    const r = await fetch(`/api/preset/model/${encodeURIComponent(tuneModel)}`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const d = await r.json();
    if (!d.ok) {
      setTuneErr(d.error || `请求失败（HTTP ${r.status}）`);
      return;
    }
    closeTune();
    fetchStatus();
  } catch (e) {
    setTuneErr(`请求失败: ${e}`);
  }
  btn.disabled = false;
}
$("tune-cancel").onclick = closeTune;
$("tune-save").onclick = saveTune;
$("tune-modal").onclick = (e) => { if (e.target === $("tune-modal")) closeTune(); };

async function serverAction(path, confirmMsg) {
  if (busy) return;
  if (confirmMsg && !(await askConfirm(confirmMsg))) return;
  setBusy(true);
  showErr(null);
  try {
    const r = await fetch(path, {method: "POST"});
    const d = await r.json();
    if (!d.ok) showErr(d.error || `请求失败（HTTP ${r.status}）`);
  } catch (e) {
    showErr(`请求失败: ${e}`);
  } finally {
    setBusy(false);
    fetchStatus();
  }
}

async function fetchStatus() {
  try {
    const r = await fetch("/api/status");
    renderStatus(await r.json());
    $("last-refresh").textContent = "最后刷新 " + new Date().toTimeString().slice(0, 8);
  } catch (e) {
    $("dot").className = "dot";
    $("proc-state").textContent = "面板连接失败";
  }
}

// ---- 日志查看器 ----
function logMatch(line) {
  if (logFilter !== "all" && !LOG_FILTERS[logFilter].test(line)) return false;
  if (logSearch && !line.toLowerCase().includes(logSearch)) return false;
  return true;
}

function filteredLogs() {
  return logLines.filter(logMatch);
}

function logLineClass(line) {
  if (/ E |error|failed|exception/i.test(line)) return "log-err";
  if (/ W |warn/i.test(line)) return "log-warn";
  if (/print_timing|eval time|draft acceptance|tg =/i.test(line)) return "log-speed";
  if (/load:|unload|evicting|stopping model/i.test(line)) return "log-event";
  if (/proxy_reques/.test(line)) return "log-muted";
  return "";
}

function renderLogs() {
  const box = $("logs");
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 20;
  let html;
  if (!logLines.length) {
    // 日志文件有内容就直接显示（外部/systemd 启动也一样）
    html = lastProc && lastProc.running
      ? "无日志：将 --log 指向服务的日志文件，或用面板「启动」接管。"
      : "无日志";
  } else {
    html = filteredLogs().map((line) => {
      const cls = logLineClass(line);
      return `<span class="log-line${cls ? " " + cls : ""}">${escHtml(line)}</span>`;
    }).join("");
    if (!html) html = "（无匹配日志）";
  }
  box.innerHTML = html;
  if (!logPaused && atBottom) box.scrollTop = box.scrollHeight;
}

async function fetchLogs() {
  try {
    const r = await fetch(`/api/logs?n=${logN}`);
    const data = await r.json();
    logLines = data.lines || [];
    renderLogs();
  } catch {}
}

const LOG_FILTER_BTNS = [["log-f-all", "all"], ["log-f-warn", "warn"], ["log-f-speed", "speed"]];
for (const [id, f] of LOG_FILTER_BTNS) {
  $(id).onclick = () => {
    logFilter = f;
    for (const [bid, bf] of LOG_FILTER_BTNS) $(bid).classList.toggle("active", bf === f);
    renderLogs();
  };
}
$("log-search").oninput = (e) => { logSearch = e.target.value.trim().toLowerCase(); renderLogs(); };
$("log-n").onchange = (e) => { logN = parseInt(e.target.value, 10); fetchLogs(); };
$("log-pause").onclick = () => {
  logPaused = !logPaused;
  $("log-pause").textContent = logPaused ? "恢复滚屏" : "暂停滚屏";
};
$("log-copy").onclick = async () => {
  const text = filteredLogs().join("\n");
  try {
    if (navigator.clipboard) await navigator.clipboard.writeText(text);
    else {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
    }
  } catch {}
  const btn = $("log-copy");
  btn.textContent = "已复制";
  setTimeout(() => { btn.textContent = "复制日志"; }, 1500);
};

// ---- 模型卡快速测速 ----
function probeLine(d) {
  const parts = [`耗时 ${(d.wall_ms / 1000).toFixed(1)}s`];
  if (d.prompt_tps !== null && d.prompt_tps !== undefined) parts.push(`Prefill ${d.prompt_tps.toFixed(0)} tok/s`);
  if (d.gen_tps !== null && d.gen_tps !== undefined) parts.push(`Decode ${d.gen_tps.toFixed(1)} tok/s`);
  if (d.spec_accept_percent !== null && d.spec_accept_percent !== undefined) parts.push(`MTP ${d.spec_accept_percent.toFixed(1)}%`);
  return parts.join(" · ");
}

async function runProbe(model) {
  if (probing) return;
  probing = true;
  probeResultHtml = '<span class="muted">测速中…</span>';
  const btn = $("btn-probe");
  if (btn) { btn.textContent = "测速中…"; btn.disabled = true; }
  const res = $("probe-result");
  if (res) res.innerHTML = probeResultHtml;
  try {
    const r = await fetch("/api/probe", {
      method: "POST",
      headers: model ? { "Content-Type": "application/json" } : undefined,
      body: model ? JSON.stringify({ model }) : undefined,
    });
    const d = await r.json();
    probeResultHtml = d.ok
      ? `<span class="muted">${probeLine(d)}</span>`
      : `<span style="color:var(--err)">${escHtml(d.error || "测速失败")}</span>`;
  } catch (e) {
    probeResultHtml = `<span style="color:var(--err)">测速失败: ${escHtml(e)}</span>`;
  }
  probing = false;
  const b = $("btn-probe");
  if (b) { b.textContent = "快速测速"; b.disabled = !lastHealth; }
  const el = $("probe-result");
  if (el) el.innerHTML = probeResultHtml;
}

// ---- 模型卡加载/卸载（Router 模式）----
async function modelAction(kind, model) {
  if (modelBusy) return;
  const confirmMsg = kind === "unloading"
    ? "确认立即卸载模型释放显存？下次收到请求会自动重新加载。"
    : null;
  if (confirmMsg && !(await askConfirm(confirmMsg))) return;
  modelBusy = kind;
  modelErrHtml = "";
  const btn = $(kind === "unloading" ? "btn-unload-model" : "btn-load-model");
  if (btn) { btn.textContent = kind === "unloading" ? "卸载中…" : "加载中…"; btn.disabled = true; }
  try {
    const path = kind === "loading" ? "/api/model/load" : "/api/model/unload";
    const r = await fetch(path, {
      method: "POST",
      headers: model ? { "Content-Type": "application/json" } : undefined,
      body: model ? JSON.stringify({ model }) : undefined,
    });
    const d = await r.json();
    if (!d.ok) {
      modelErrHtml = `<span style="color:var(--err)">${escHtml(d.error || `请求失败（HTTP ${r.status}）`)}</span>`;
    }
  } catch (e) {
    modelErrHtml = `<span style="color:var(--err)">${escHtml(`请求失败: ${e}`)}</span>`;
  }
  modelBusy = null;
  fetchStatus();
}

// ---- 快捷对话试跑（Quick Chat）----
let chatBusy = false;
function syncChatModel(modelsList, mid) {
  const sel = $("chat-model");
  if (!sel) return;
  const cur = sel.value;
  const opts = modelsList.length ? modelsList.map((m) => m.id).filter(Boolean)
    : (mid ? [mid] : []);
  sel.innerHTML = opts.map((id) => `<option value="${escHtml(id)}">${escHtml(id)}</option>`).join("");
  if (opts.length === 1) sel.value = opts[0];
  else if (opts.includes(cur)) sel.value = cur;
  else if (mid && opts.includes(mid)) sel.value = mid;
}
function renderChatOut(d) {
  const out = $("chat-out");
  if (!d.ok) {
    out.innerHTML = `<span style="color:var(--err)">${escHtml(d.error || "请求失败")}</span>`;
    return;
  }
  const pills = [];
  if (d.elapsed_s !== null && d.elapsed_s !== undefined) pills.push(`耗时 ${d.elapsed_s}s`);
  if (d.prompt_per_second !== null && d.prompt_per_second !== undefined) pills.push(`提示词 ${d.prompt_per_second.toFixed(0)} tok/s`);
  if (d.predicted_per_second !== null && d.predicted_per_second !== undefined) pills.push(`生成 ${d.predicted_per_second.toFixed(1)} tok/s`);
  if (d.predicted_n !== null && d.predicted_n !== undefined) pills.push(`生成 ${d.predicted_n} tokens`);
  let html = "";
  if (pills.length) html += `<div style="margin-bottom:8px">${pills.map((p) => `<span class="chat-pill">${escHtml(p)}</span>`).join("")}</div>`;
  if (d.reasoning) html += `<details style="margin-bottom:8px"><summary>思考过程</summary><div style="white-space:pre-wrap;color:var(--muted);font-size:12px">${escHtml(d.reasoning)}</div></details>`;
  html += `<div style="white-space:pre-wrap">${escHtml(d.content || "")}</div>`;
  out.innerHTML = html;
}
let chatAbort = null; // 流式试跑的 AbortController（停止按钮用）
function chatStop() { if (chatAbort) chatAbort.abort(); }
async function sendChat() {
  if (chatBusy) return;
  const prompt = $("chat-input").value;
  if (!prompt.trim()) { renderChatOut({ ok: false, error: "提示词不能为空" }); return; }
  chatBusy = true;
  chatAbort = new AbortController();
  const btn = $("btn-chat-send");
  btn.disabled = true; btn.textContent = "发送中…";
  $("btn-chat-stop").classList.remove("hidden");
  const out = $("chat-out");
  // 流式打字机：思考过程（details）+ 正文（div），全程 textContent 防 XSS
  const details = document.createElement("details");
  details.style.marginBottom = "8px";
  const summary = document.createElement("summary");
  summary.textContent = "思考过程";
  const rDiv = document.createElement("div");
  rDiv.style.cssText = "white-space:pre-wrap;color:var(--muted);font-size:12px";
  details.append(summary, rDiv);
  const cDiv = document.createElement("div");
  cDiv.style.whiteSpace = "pre-wrap";
  out.append(details, cDiv);
  let hasReasoning = false;
  const body = { prompt, max_tokens: 512 };
  const sel = $("chat-model");
  if (sel.value) body.model = sel.value;
  try {
    const r = await fetch("/api/chat/stream", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
      signal: chatAbort.signal,
    });
    if (!r.ok) {
      let msg = `请求失败（HTTP ${r.status}）`;
      try { const d = await r.json(); if (d.error) msg = d.error; } catch {}
      out.innerHTML = `<span style="color:var(--err)">${escHtml(msg)}</span>`;
    } else {
      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf("\n\n")) !== -1) {
          const chunk = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          for (const line of chunk.split("\n")) {
            const t = line.trim();
            if (!t.startsWith("data:")) continue;
            let ev;
            try { ev = JSON.parse(t.slice(5).trim()); } catch { continue; }
            if (ev.type === "reasoning") {
              hasReasoning = true;
              rDiv.textContent += ev.delta;
            } else if (ev.type === "content") {
              cDiv.textContent += ev.delta;
            } else if (ev.type === "done") {
              const pills = [];
              if (ev.elapsed_s !== null && ev.elapsed_s !== undefined) pills.push(`耗时 ${ev.elapsed_s}s`);
              if (ev.prompt_per_second !== null && ev.prompt_per_second !== undefined) pills.push(`提示词 ${Number(ev.prompt_per_second).toFixed(0)} tok/s`);
              if (ev.predicted_per_second !== null && ev.predicted_per_second !== undefined) pills.push(`生成 ${Number(ev.predicted_per_second).toFixed(1)} tok/s`);
              if (ev.predicted_n !== null && ev.predicted_n !== undefined) pills.push(`生成 ${ev.predicted_n} tokens`);
              if (pills.length) {
                const row = document.createElement("div");
                row.style.marginBottom = "8px";
                for (const p of pills) {
                  const s = document.createElement("span");
                  s.className = "chat-pill";
                  s.textContent = p;
                  row.appendChild(s);
                }
                out.prepend(row);
              }
            } else if (ev.type === "error") {
              out.innerHTML = `<span style="color:var(--err)">${escHtml(ev.error || "请求失败")}</span>`;
            }
          }
        }
      }
      if (!hasReasoning) details.remove();
    }
  } catch (e) {
    if (e.name === "AbortError") {
      const note = document.createElement("div");
      note.style.color = "var(--muted)";
      note.textContent = "[已停止]";
      out.append(note);
    } else {
      out.innerHTML = `<span style="color:var(--err)">请求失败: ${escHtml(e)}</span>`;
    }
  }
  chatBusy = false;
  chatAbort = null;
  btn.disabled = false; btn.textContent = "发送";
  $("btn-chat-stop").classList.add("hidden");
}
$("btn-chat-send").onclick = sendChat;
$("btn-chat-stop").onclick = chatStop;
$("chat-input").addEventListener("keydown", (e) => { if (e.key === "Enter") sendChat(); });

$("model-card").addEventListener("click", (e) => {
  if (e.target.id === "btn-probe" && !e.target.disabled) runProbe();
  if (e.target.id === "btn-load-model" && !e.target.disabled) modelAction("loading");
  if (e.target.id === "btn-unload-model" && !e.target.disabled) modelAction("unloading");
  // 多模型行
  if (e.target.classList.contains("mm-probe") && !e.target.disabled) runProbe(e.target.dataset.model);
  if (e.target.classList.contains("mm-load") && !e.target.disabled) modelAction("loading", e.target.dataset.model);
  if (e.target.classList.contains("mm-unload") && !e.target.disabled) modelAction("unloading", e.target.dataset.model);
  if (e.target.classList.contains("mm-tune") && !e.target.disabled) openTune(e.target.dataset.model);
  if (e.target.id === "btn-apply-sleep-idle" && !e.target.disabled) applySleepIdle();
});
$("model-card").addEventListener("change", (e) => {
  if (e.target.id === "sel-sleep-idle") sleepIdleSel = parseInt(e.target.value, 10);
});
$("power-card").addEventListener("click", (e) => {
  if (e.target.classList.contains("power-btn") && !e.target.disabled) setPowerProfile(e.target.dataset.profile);
});

$("btn-refresh").onclick = () => { fetchStatus(); fetchLogs(); fetchTraces(); };

$("btn-start").onclick = () => serverAction("/api/server/start", null);
$("btn-stop").onclick = () => serverAction("/api/server/stop", "确认停止 llama-server 服务？");
$("btn-restart").onclick = () => serverAction("/api/server/restart", "确认重启 llama-server 服务？");

// ---- 实时会话监控（/v1 代理 traces，仅内存保留最近 20 条）----
const openTraceIds = new Set(); // 用户手动展开的 trace id（轮询重渲染时保留 open 状态）
const openTraceSubKeys = new Set(); // 用户手动展开的内部子块（req/think）
$("proxy-url").textContent = location.origin + "/v1";

function traceSummary(t) {
  const badge = t.status === "streaming"
    ? `<span class="tag loading">生成中…</span>`
    : t.status === "ok"
      ? `<span class="tag loaded">完成</span>`
      : `<span class="tag" style="background:rgba(247,92,92,.15);color:var(--err)">失败</span>`;
  const time = new Date(t.ts * 1000).toTimeString().slice(0, 8);
  const pills = [];
  if (t.elapsed_s !== null && t.elapsed_s !== undefined) pills.push(`耗时 ${Number(t.elapsed_s).toFixed(1)}s`);
  if (t.predicted_per_second !== null && t.predicted_per_second !== undefined) pills.push(`${Number(t.predicted_per_second).toFixed(1)} tok/s`);
  if (t.tool_calls && t.tool_calls.length) pills.push(`工具 ${t.tool_calls.length}`);
  const preview = (t.last_user || "").replace(/\s+/g, " ").trim() || "—";
  return `${badge}
    <span class="trace-time">${time}</span>
    <code>${escHtml(t.model || "?")}</code>
    <span class="trace-preview">${escHtml(preview)}</span>
    <span class="trace-pills">${pills.map((p) => `<span class="chat-pill">${escHtml(p)}</span>`).join("")}</span>`;
}

function traceBody(t) {
  const msgs = t.messages_preview || [];
  let html = `<details class="trace-sub" data-sub-key="${t.id}:req"${openTraceSubKeys.has(`${t.id}:req`) ? " open" : ""}><summary>请求摘要（共 ${t.messages_count ?? msgs.length} 条）</summary>
    ${msgs.length
      ? msgs.map((m) => `<div class="trace-msg"><span class="tag trace-role">${escHtml(m.role || "?")}</span><span class="trace-msg-text">${escHtml(m.text || "")}</span></div>`).join("")
      : `<span class="muted">—</span>`}
  </details>`;
  if (t.reasoning) {
    html += `<details class="trace-sub" data-sub-key="${t.id}:think"${openTraceSubKeys.has(`${t.id}:think`) ? " open" : ""}><summary>思考过程</summary><div class="trace-block">${escHtml(t.reasoning)}</div></details>`;
  }
  if (t.tool_calls && t.tool_calls.length) {
    html += `<div>
      <div class="trace-label">工具调用</div>
      <div style="display:grid;gap:8px;margin-top:6px">
        ${t.tool_calls.map((tc) => {
          const fn = tc.function || {};
          return `<div class="trace-tool"><code>${escHtml(fn.name || "?")}</code><div class="trace-block">${escHtml(fn.arguments || "")}</div></div>`;
        }).join("")}
      </div>
    </div>`;
  }
  if (t.content) {
    html += `<div>
      <div class="trace-label">模型输出</div>
      <div class="trace-block" style="margin-top:6px">${escHtml(t.content)}</div>
    </div>`;
  }
  if (t.error) html += `<div class="err-bar">${escHtml(t.error)}</div>`;
  return html;
}

function renderTraces(traces) {
  $("trace-count").textContent = traces.length ? ` · ${traces.length} 条` : "";
  const list = $("trace-list");
  if (!traces.length) {
    list.innerHTML = `<div class="muted trace-empty">暂无代理会话（将 pi / dsh 的 baseUrl 指向当前代理地址即可自动记录）</div>`;
    return;
  }
  list.innerHTML = traces.map((t) =>
    `<details class="trace-item" data-trace-id="${t.id}"${openTraceIds.has(t.id) ? " open" : ""}>
      <summary>${traceSummary(t)}</summary>
      <div class="trace-body">${traceBody(t)}</div>
    </details>`).join("");
}

// 记录用户展开/收起状态：轮询重渲染时绝不打断用户阅读
$("trace-list").addEventListener("toggle", (e) => {
  const el = e.target; // toggle 事件不冒泡，必须捕获阶段监听
  if (!el.classList) return;
  if (el.classList.contains("trace-item")) {
    const id = Number(el.dataset.traceId);
    if (el.open) openTraceIds.add(id); else openTraceIds.delete(id);
  } else if (el.classList.contains("trace-sub")) {
    const key = el.dataset.subKey;
    if (el.open) openTraceSubKeys.add(key); else openTraceSubKeys.delete(key);
  }
}, true);

async function fetchTraces() {
  try {
    const r = await fetch("/api/traces?limit=20");
    const d = await r.json();
    renderTraces(d.traces || []);
  } catch {}
}

$("btn-traces-clear").onclick = async () => {
  const btn = $("btn-traces-clear");
  btn.disabled = true;
  try { await fetch("/api/traces/clear", { method: "POST" }); } catch {}
  openTraceIds.clear();
  openTraceSubKeys.clear();
  fetchTraces();
  btn.disabled = false;
};

// 轮询定时器：后台标签页自动暂停（visibilitychange），切回可见立即刷新并恢复
let statusTimer = null;
let logsTimer = null;
let tracesTimer = null;
function startPolling() {
  stopPolling();
  statusTimer = setInterval(fetchStatus, 2000);
  logsTimer = setInterval(fetchLogs, 5000);
  tracesTimer = setInterval(fetchTraces, 2000);
}
function stopPolling() {
  if (statusTimer) { clearInterval(statusTimer); statusTimer = null; }
  if (logsTimer) { clearInterval(logsTimer); logsTimer = null; }
  if (tracesTimer) { clearInterval(tracesTimer); tracesTimer = null; }
}
function refreshAll() { fetchStatus(); fetchLogs(); fetchTraces(); }
refreshAll();
startPolling();
document.addEventListener("visibilitychange", () => {
  if (document.hidden) stopPolling();
  else { refreshAll(); startPolling(); }
});
</script>
</body>
</html>
